<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cheyoon Image Uploads</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/assets/image-uploads.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <h1>Cheyoon Image Uploads</h1>
          <p class="subtitle">comfyui <code>input/</code> folder</p>
        </div>
        <button
          class="refresh"
          id="refresh-btn"
          title="Refresh list"
          aria-label="Refresh list"
        >
          <svg
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M3 21v-5h5" />
          </svg>
        </button>
      </div>
      <div class="status-line" id="status-line" aria-live="polite">
        Loading&hellip;
      </div>
      <div class="list-scroll">
        <ul class="file-list" id="file-list"></ul>
        <div class="empty" id="empty-state" hidden>
          <div>
            <p class="empty-title" id="empty-title">No files yet</p>
            <p class="empty-hint" id="empty-hint">
              Files added to this folder will appear here.
            </p>
          </div>
        </div>
      </div>
      <div class="delete-bar">
        <button
          class="delete-btn"
          id="delete-bar"
          type="button"
          disabled
          title="Delete the selected files"
        >
          Delete
        </button>
      </div>
    </aside>

    <main class="drop-area" id="drop-area">
      <div class="drop-inner">
        <svg
          class="drop-icon"
          viewBox="0 0 24 24"
          width="42"
          height="42"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 15.5V3.5" />
          <path d="M8 7.5l4-4 4 4" />
          <rect x="3.5" y="15" width="17" height="5.5" rx="1.5" />
        </svg>
        <h2>Drop your images here</h2>
        <ul class="pending-list" id="pending-list" hidden></ul>
        <p class="pending-more" id="pending-more" hidden></p>
        <button class="upload-btn" id="upload-btn" type="button">
          Select files to upload
        </button>
        <button class="clear-btn" id="clear-btn" type="button" hidden>
          Clear selection
        </button>
        <p class="drop-hint">or drop files anywhere in this panel</p>
        <p class="drop-msg" id="drop-msg" aria-live="polite"></p>
        <input type="file" id="file-input" accept="image/*" multiple hidden />
      </div>
    </main>

    <dialog
      class="confirm"
      id="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-note"
    >
      <div class="confirm-inner">
        <h2 id="confirm-title">Delete file?</h2>
        <p class="confirm-note" id="confirm-note">
          Permanently removes the selected files from this folder.
        </p>
        <ul class="confirm-list" id="confirm-list"></ul>
        <p class="confirm-more" id="confirm-more" hidden></p>
        <p class="confirm-msg" id="confirm-msg" aria-live="polite"></p>
        <div class="confirm-actions">
          <button class="ghost-btn" id="cancel-btn" type="button">
            Cancel
          </button>
          <button class="danger-btn" id="confirm-btn" type="button">
            Delete
          </button>
        </div>
      </div>
    </dialog>

    <script type="module">
      import { createImageUploadsUI } from "/assets/image-uploads.js";

      createImageUploadsUI({
        apiBase: "/api/cy-image-uploads",
        envVar: "AIGW_CY_IMAGE_UPLOADS_FOLDER",
      });
    </script>
  </body>
</html>
