<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <title>Log Finder</title>
    <script>
      // Resolve the theme before the body parses, so the first paint and the
      // toggle icon already match the system preference.
      document.documentElement.dataset.theme = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --panel: #ffffff;
        --text: #1c2333;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-text: #ffffff;
        --result-bg: #111827;
        --result-text: #e5e7eb;
        --border: #d1d5db;
        --field-border: var(--border);
        --error: #b91c1c;
        --shadow: rgb(0 0 0 / 0.08);
        --drag-overlay: rgb(37 99 235 / 0.08);
        /* JSON token colours stay fixed: the result panel is dark in both
           themes, so they are not overridden by the dark block below. */
        --tok-key: #93c5fd;
        --tok-str: #86efac;
        --tok-num: #fbbf24;
        --tok-bool: #f472b6;
        --tok-null: #9ca3af;
        --radius: 10px;
      }
      /* The head script resolves the theme on load from prefers-color-scheme
         and stores it on the root element, so [data-theme="dark"] covers both
         the system default and a manual switch. The media query is the
         JavaScript-free fallback: without the script there is no data-theme,
         so the system preference still selects the dark palette. */
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #12161d;
        --panel: #1c222c;
        --text: #e6e9f0;
        --muted: #9aa4b2;
        --accent: #60a5fa;
        --accent-hover: #3b82f6;
        --accent-text: #0b1220;
        --result-bg: #0d1117;
        --result-text: #d6dbe4;
        --border: #3a4452;
        --field-border: #64707d;
        --error: #f87171;
        /* black shadows vanish on a dark background, so dark card depth
           comes from a faint accent glow plus the border */
        --shadow: rgb(96 165 250 / 0.12);
        --drag-overlay: rgb(96 165 250 / 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --bg: #12161d;
          --panel: #1c222c;
          --text: #e6e9f0;
          --muted: #9aa4b2;
          --accent: #60a5fa;
          --accent-hover: #3b82f6;
          --accent-text: #0b1220;
          --result-bg: #0d1117;
          --result-text: #d6dbe4;
          --border: #3a4452;
          --field-border: #64707d;
          --error: #f87171;
          --shadow: rgb(96 165 250 / 0.12);
          --drag-overlay: rgb(96 165 250 / 0.12);
        }
        :root:not([data-theme]) .theme-toggle .icon-sun {
          display: block;
        }
        :root:not([data-theme]) .theme-toggle .icon-moon {
          display: none;
        }
      }
      /* Explicit light keeps native controls (scrollbars, form widgets)
         light even when the system itself prefers dark. */
      [data-theme="light"] {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body.dragging::after {
        content: "Drop image to fill filename";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--accent);
        background: var(--drag-overlay);
        border: 3px dashed var(--accent);
        pointer-events: none;
      }
      main {
        width: min(980px, calc(100% - 2rem));
        margin-top: 12vh;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
        text-align: center;
      }
      p.subtitle {
        margin: 0 0 1.25rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        max-width: 680px;
        margin-inline: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem;
        box-shadow: 0 1px 3px var(--shadow);
      }
      #filename {
        flex: 1;
        min-width: 0;
        font-size: 1rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--field-border);
        border-radius: 6px;
        color: inherit;
        background: transparent;
      }
      #find {
        font-size: 1rem;
        font-weight: 600;
        padding: 0.6rem 1.25rem;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
        white-space: nowrap;
      }
      #find:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      #find:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .file-row {
        margin-top: 0.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #browse {
        background: none;
        border: 0;
        padding: 0;
        font-size: inherit;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
      }
      #status {
        min-height: 1.5em;
        margin: 0.75rem 0 0.5rem;
        text-align: center;
        font-size: 0.95rem;
        color: var(--muted);
      }
      #status.error {
        color: var(--error);
      }
      #result {
        margin: 0;
        padding: 1rem 1.25rem;
        border-radius: var(--radius);
        background: var(--result-bg);
        color: var(--result-text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #result:empty {
        display: none;
      }
      .tok-key {
        color: var(--tok-key);
      }
      .tok-str {
        color: var(--tok-str);
      }
      .tok-num {
        color: var(--tok-num);
      }
      .tok-bool {
        color: var(--tok-bool);
      }
      .tok-null {
        color: var(--tok-null);
      }
      .theme-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        /* above the drag overlay, which is generated after the button */
        z-index: 1;
        width: 2.25rem;
        height: 2.25rem;
        display: grid;
        place-items: center;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
      }
      .theme-toggle:hover {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent);
      }
      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Each icon is explicitly shown or hidden so neither state depends on
         the UA default for an inline <svg>: light shows the moon, dark shows
         the sun (the media query above covers the no-JS dark case). */
      .theme-toggle .icon-sun {
        display: none;
      }
      .theme-toggle .icon-moon {
        display: block;
      }
      [data-theme="dark"] .theme-toggle .icon-sun {
        display: block;
      }
      [data-theme="dark"] .theme-toggle .icon-moon {
        display: none;
      }
    </style>
  </head>
  <body>
    <button
      id="theme-toggle"
      type="button"
      class="theme-toggle"
      aria-label="Switch theme"
      title="Switch theme"
    >
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4.5" />
        <path
          d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"
        />
      </svg>
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.5 6.5 0 0 0 10 10z" />
      </svg>
    </button>
    <main>
      <h1>Log Finder</h1>
      <p class="subtitle">
        Paste an image filename or path, or drop the image anywhere to search.
      </p>
      <div class="controls">
        <input
          id="filename"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="rover_20261003212855.png or full path…"
        />
        <button id="find" type="button">Find</button>
      </div>
      <div class="file-row">
        or
        <button id="browse" type="button">choose a file…</button>
        <input id="file" type="file" hidden />
      </div>
      <p id="status" aria-live="polite"></p>
      <pre id="result"></pre>
    </main>
    <script>
      const API_URL = "/api/logging/find-log";
      const THEME_LIGHT = "light";
      const THEME_DARK = "dark";
      const THEME_ACCENTS = {
        [THEME_LIGHT]: "#2563eb",
        [THEME_DARK]: "#60a5fa",
      };

      const input = document.getElementById("filename");
      const findButton = document.getElementById("find");
      const fileInput = document.getElementById("file");
      const browseButton = document.getElementById("browse");
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const themeToggle = document.getElementById("theme-toggle");
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');

      function otherTheme(theme) {
        return theme === THEME_DARK ? THEME_LIGHT : THEME_DARK;
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeColorMeta.setAttribute("content", THEME_ACCENTS[theme]);
        const switchLabel = "Switch to " + otherTheme(theme) + " theme";
        themeToggle.setAttribute("aria-label", switchLabel);
        themeToggle.setAttribute("title", switchLabel);
        themeToggle.setAttribute(
          "aria-pressed",
          theme === THEME_DARK ? "true" : "false",
        );
      }

      function extractKey(raw) {
        const trimmed = String(raw).trim();
        if (trimmed === "") return "";
        const base = trimmed.replace(/\\/g, "/").split("/").pop();
        const dotIndex = base.lastIndexOf(".");
        if (dotIndex > 0) return base.slice(0, dotIndex);
        return base;
      }

      function isEmptyKey(raw, key) {
        // extractKey(".png") already returns "", so `key === ""` alone
        // covers the only-extension case (matching server normalizeFilename).
        return key === "";
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function highlightJson(escaped) {
        return escaped.replace(
          /(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false)\b|\b(null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
          (match, str, colon, bool, nil, num) => {
            if (str !== undefined) {
              if (colon !== undefined) {
                return '<span class="tok-key">' + str + "</span>" + colon;
              }
              return '<span class="tok-str">' + str + "</span>";
            }
            if (bool !== undefined) {
              return '<span class="tok-bool">' + bool + "</span>";
            }
            if (nil !== undefined) {
              return '<span class="tok-null">' + nil + "</span>";
            }
            return '<span class="tok-num">' + num + "</span>";
          },
        );
      }

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      function fillFromFileName(name) {
        input.value = extractKey(name);
        input.focus();
      }

      // Both the browse picker and the drop handler take the first file from a
      // FileList; selection and search differ between the two paths.
      function firstName(files) {
        return files && files[0] ? files[0].name : null;
      }

      async function lookup() {
        // The Find button is disabled while a search runs, so this also blocks
        // Enter-key and drop triggers from starting an overlapping lookup.
        if (findButton.disabled) return;
        const key = extractKey(input.value);
        if (isEmptyKey(input.value, key)) {
          resultEl.textContent = "";
          setStatus("Please enter a filename.", true);
          return;
        }
        findButton.disabled = true;
        setStatus("Searching…", false);
        resultEl.textContent = "";
        try {
          const response = await fetch(
            API_URL + "?filename=" + encodeURIComponent(key),
            { headers: { Accept: "application/json" } },
          );
          let data = null;
          try {
            data = await response.json();
          } catch {
            data = null;
          }
          if (response.ok) {
            if (data === null || data === undefined) {
              setStatus("Request failed: invalid JSON response.", true);
              return;
            }
            resultEl.innerHTML = highlightJson(
              escapeHtml(JSON.stringify(data, null, 2)),
            );
            setStatus("", false);
          } else {
            const message =
              data && data.error ? data.error : "unexpected response";
            setStatus("Error " + response.status + ": " + message, true);
          }
        } catch (error) {
          setStatus(
            "Request failed: " +
              (error && error.message ? error.message : String(error)),
            true,
          );
        } finally {
          findButton.disabled = false;
        }
      }

      applyTheme(document.documentElement.dataset.theme || THEME_LIGHT);
      themeToggle.addEventListener("click", () => {
        applyTheme(otherTheme(document.documentElement.dataset.theme));
      });

      findButton.addEventListener("click", lookup);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") lookup();
      });

      browseButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const name = firstName(fileInput.files);
        if (name !== null) {
          fillFromFileName(name);
        }
        fileInput.value = "";
      });

      document.addEventListener("dragover", (event) => {
        event.preventDefault();
        document.body.classList.add("dragging");
      });
      document.addEventListener("dragleave", (event) => {
        if (event.relatedTarget === null) {
          document.body.classList.remove("dragging");
        }
      });

      // A dropped file fills the field and searches immediately, so the Find
      // button is not needed. Non-file drops (selected text, links) carry no
      // files and only report the problem; with several files the first is
      // used, like the browse picker above.
      function handleFileDrop(event) {
        event.preventDefault();
        document.body.classList.remove("dragging");
        const name = firstName(
          event.dataTransfer ? event.dataTransfer.files : null,
        );
        if (name === null) {
          setStatus("Nothing to search: drop an image file.", true);
          return;
        }
        fillFromFileName(name);
        lookup();
      }
      document.addEventListener("drop", handleFileDrop);
    </script>
  </body>
</html>
