# e2e-38: Combined overrides on a UNETLoader base: prompt + negative + steps + cfg + size +
# sampler/scheduler + filename-prefix + two-lora chain + tries (fixed seed is randomized).
- base-workflow: unet-base
  steps: 28
  cfg: 3.5
  sampler: dpmpp_2m
  scheduler: karras
  size:
    width: 896
    height: 1152
  filename-prefix: unet-complex
  seed: 515151
  tries: 2
  loras:
    - name: unet-style-lora.safetensors
      strength: 0.85
    - name: unet-detail-lora.safetensors
      strength: 0.35
  prompts:
    - prompt:
        - unet base with every override
      negative-prompt:
        - blurry
        - low quality
